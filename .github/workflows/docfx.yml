name: Build and deploy DocFX

on:
  push:
    branches: [ main, excercise/09-garage3 ]
    paths:
      - 'Exercise*/**'
      - 'docs/site-index.html'
      - '.github/workflows/docfx.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Add DocFX to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build documentation for all exercises
        run: |
          set -e
          rm -rf site
          mkdir -p site
          for cfg in $(find . -path './Exercise*/*/docfx/docfx.json' | sort); do
            dir=$(dirname "$cfg")
            exercise=$(echo "$dir" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
            (cd "$dir" && docfx docfx.json)
            mkdir -p "site/$exercise"
            cp -r "$dir/_site/." "site/$exercise/"
          done
          cp docs/site-index.html site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
